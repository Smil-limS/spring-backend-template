# 로컬 개발: compose.yaml 의 PostgreSQL 사용.
# bootRun 시 spring-boot-docker-compose 가 컨테이너를 띄우고 접속 정보를 자동 주입한다.
# (아래 datasource 값은 compose 연동을 끄고 직접 DB에 붙을 때의 기본값)
spring:
  config:
    import: "optional:file:./.env[.properties]"
  docker:
    compose:
      lifecycle-management: start-only # 앱을 꺼도 컨테이너는 유지

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.app: debug
