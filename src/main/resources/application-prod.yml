# 운영: 모든 접속 정보는 환경 변수로 주입한다. (기본값 없음 → 누락 시 기동 실패가 의도된 동작)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 운영 스키마는 절대 자동 변경하지 않는다
    show-sql: false

logging:
  level:
    root: info
